name: Verify cold Windows scene startup
on:
  push:
    branches: [codex/recall-scene-probe]
permissions:
  contents: read
jobs:
  first-render:
    runs-on: windows-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        sample: [one, two]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Render before any browser or guardian warmup
        run: node --test --test-timeout=120000 --test-name-pattern="real browser renders persisted scene" test/home-scene-view.test.mjs
      - name: Verify native admission and cleanup
        if: always()
        run: node --test --test-timeout=120000 test/home-browser-process.test.mjs
