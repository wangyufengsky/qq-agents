name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install media test tools on Linux
        if: runner.os == 'Linux'
        timeout-minutes: 6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Install media test tools on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install media test tools on Windows
        if: runner.os == 'Windows'
        timeout-minutes: 8
        run: |
          # The package CDN remains available when the NuGet query feed returns 503/504.
          # Keep the official package and checksum pinned; install from a local source.
          $version = '9.0.2'
          $packageDir = Join-Path $env:RUNNER_TEMP 'qq-agents-media-packages'
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          $package = Join-Path $packageDir "ffmpeg.$version.nupkg"
          Invoke-WebRequest -Uri "https://community.chocolatey.org/api/v2/package/ffmpeg/$version" -OutFile $package -TimeoutSec 120 -MaximumRetryCount 3 -RetryIntervalSec 5
          $expected = '5c8a22a97405200056d7672b07a25acc4f03efe0cac85c3f38349e2190bf7033'
          if ((Get-FileHash $package -Algorithm SHA256).Hash -ne $expected) { throw 'FFmpeg package checksum mismatch' }
          choco install ffmpeg --version $version --source $packageDir -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg installation failed: $LASTEXITCODE" }
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1
      - run: npm ci
      - name: Set public CI commit identity for privacy checks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - run: npm run verify
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --build-arg SOURCE_COMMIT=${{ github.sha }} -t qq-agents:ci .
      - name: Smoke-test the container console through a loopback port mapping
        run: |
          docker run -d --name qq-agents-ci -p 127.0.0.1:3210:3210 qq-agents:ci
          docker exec qq-agents-ci node --input-type=module -e 'import { FrameworkKnowledge } from "./src/core/framework-knowledge.mjs"; const k = new FrameworkKnowledge(); if (k.version.provenance !== "verified-build-manifest" || !k.files.has("docs/AGENT-FRAMEWORK.md")) process.exit(1);'
          for i in $(seq 1 30); do
            docker exec qq-agents-ci test -s /data/admin-token && break
            sleep 1
          done
          token=$(docker exec qq-agents-ci cat /data/admin-token)
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 \
            -H "x-admin-token: $token" http://127.0.0.1:3210/api/status \
            | grep -q '"mode":"isolated"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: 192.0.2.1:3210' http://127.0.0.1:3210/api/status)" = 403
      - if: failure()
        run: docker logs qq-agents-ci
