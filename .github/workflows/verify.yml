name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install media test tools on Linux
        if: runner.os == 'Linux'
        timeout-minutes: 6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Install media test tools on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: npm ci
      - name: Set public CI commit identity for privacy checks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - run: npm run verify
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t qq-agents:ci .
      - name: Smoke-test the container console through a loopback port mapping
        run: |
          docker run -d --name qq-agents-ci -p 127.0.0.1:3210:3210 qq-agents:ci
          for i in $(seq 1 30); do
            docker exec qq-agents-ci test -s /data/admin-token && break
            sleep 1
          done
          token=$(docker exec qq-agents-ci cat /data/admin-token)
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 \
            -H "x-admin-token: $token" http://127.0.0.1:3210/api/status \
            | grep -q '"mode":"isolated"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: 192.0.2.1:3210' http://127.0.0.1:3210/api/status)" = 403
      - if: failure()
        run: docker logs qq-agents-ci
