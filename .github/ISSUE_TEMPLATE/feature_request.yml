name: 功能建议
description: 提出新功能或改进
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        改变默认行为、配置格式或安全边界的建议，请先在这里讨论清楚再写代码。不要附上真实 QQ 号、令牌或聊天内容。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在遇到了什么困难？在什么场景下？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 希望它怎么工作；涉及管理台时说明在哪个页面、怎么操作。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 其他做法，或者现在是怎么绕过这个问题的。
