version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Keep the Node typings on the major that CI and `engines` run (Node 24);
      # newer typings would let code use APIs Node 24 does not have. Drop this
      # when the project moves to a newer Node line.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
  # Workflows pin actions to a commit SHA with a version comment; Dependabot
  # bumps the SHA and rewrites the comment to the new tag.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
