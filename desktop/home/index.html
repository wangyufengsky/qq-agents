<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>桌面小窝</title>
    <link rel="stylesheet" href="style.css" />
    <script src="renderer.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <template id="panel-template">
      <main class="panel">
        <header class="header">
          <div class="header-title">
            <img
              class="nest-door"
              src="../../public/home-preview/assets/door.webp"
              alt=""
            />
            <h1>桌面小窝</h1>
            <span class="edition" hidden></span>
          </div>
          <div class="header-actions">
            <button
              type="button"
              class="tools-launch"
              aria-haspopup="dialog"
              hidden
            >
              <span aria-hidden="true">···</span> 小窝工具<i
                class="grant-indicator"
                hidden
              ></i>
            </button>
            <button
              class="icon-button close"
              aria-label="收起小窝"
              title="收起小窝"
            >
              ×
            </button>
          </div>
        </header>
        <nav class="tabs" aria-label="小窝页面">
          <button data-tab="visits" aria-pressed="true">来访</button>
          <button data-tab="chat" aria-pressed="false">聊天</button>
          <button data-tab="observation" aria-pressed="false" hidden>
            观察
          </button>
        </nav>
        <p
          class="body-announcement sr-only"
          role="status"
          aria-atomic="true"
        ></p>
        <section id="visits">
          <div class="section-heading">
            <h2>邀请来访</h2>
          </div>
          <div class="door-settings" hidden>
            <label for="door-mode">主动来访</label>
            <select id="door-mode">
              <option value="off">关闭敲门</option>
              <option value="welcome">欢迎敲门</option>
              <option value="always">随时欢迎</option>
              <option value="busy">正在忙</option>
            </select>
            <button type="button" class="secondary knock-trial">
              试一次敲门
            </button>
          </div>
          <div class="knock-card" hidden>
            <span class="knock-label"></span>
            <button type="button" class="primary knock-accept">请进</button>
            <button type="button" class="secondary knock-dismiss">
              下次吧
            </button>
          </div>
          <div class="guest-list"></div>
          <p class="room-notice" role="status"></p>
          <p class="observation-ended" role="status" hidden></p>
          <button type="button" class="secondary body-zones" hidden>
            设置桌宠禁停区
          </button>
          <div class="sample-settings" hidden>
            <button class="settings secondary" aria-expanded="false">
              刷新设置
            </button>
            <form class="timer-settings" hidden>
              <label for="minutes">定时刷新</label>
              <input
                type="number"
                min="1"
                max="1440"
                step="1"
                id="minutes"
                value="60"
                aria-label="刷新间隔（分钟）"
              />
              <span>分钟</span>
              <label class="switch"
                ><input id="timer-on" type="checkbox" checked /> 启用</label
              >
              <button type="submit" class="secondary">保存</button>
            </form>
          </div>
        </section>
        <section id="chat" hidden>
          <div class="audience" aria-label="在场名单"></div>
          <div
            class="thread"
            tabindex="0"
            role="log"
            aria-label="聊天记录"
          ></div>
          <div class="chat-tools">
            <p class="turn-status" role="status" hidden></p>
            <div class="task-draft" hidden>
              <span></span
              ><button type="button" class="quiet task-clear">取消</button>
            </div>
            <div class="window-task-feedback" hidden>
              <p class="window-task-status" role="status"></p>
              <button type="button" class="quiet window-task-stop" hidden>
                取消窗口任务
              </button>
            </div>
            <form class="composer">
              <button
                type="button"
                class="composer-plus secondary"
                aria-label="附件和窗口任务"
                aria-expanded="false"
                aria-controls="composer-menu"
                hidden
              >
                ＋
              </button>
              <label class="sr-only" for="message">发到房间</label>
              <input
                id="message"
                maxlength="1000"
                autocomplete="off"
                placeholder="说点什么…"
              />
              <button type="submit" class="primary">发送</button>
            </form>
            <p class="attachment-status" role="status" hidden></p>
            <p class="observation-ended" role="status" hidden></p>
          </div>
          <div id="composer-menu" class="composer-menu" hidden>
            <button
              type="button"
              class="secondary attach"
              hidden
              aria-label="发送附件"
            >
              添加附件
            </button>
            <button type="button" class="secondary open-task" hidden>
              窗口任务
            </button>
          </div>
        </section>
        <section id="observation-review" aria-label="观察审核" hidden>
          <h2>观察审核</h2>
          <p class="review-scope"></p>
          <p class="observation-ended" role="status" hidden></p>
          <p class="review-status" role="status" hidden></p>
          <article class="review-candidate" hidden>
            <p class="review-candidate-meta"></p>
            <div class="review-response" hidden>
              <h3>回复候选</h3>
              <p class="review-text"></p>
              <button type="button" class="primary" data-review="publish">
                发布回复
              </button>
            </div>
            <div class="review-summary" hidden>
              <h3>摘要候选</h3>
              <p class="review-text"></p>
              <button type="button" class="secondary" data-review="save">
                保存摘要
              </button>
            </div>
            <button type="button" class="secondary" data-review="discard">
              丢弃候选
            </button>
          </article>
          <article class="review-published" hidden>
            <h3>已发布回复</h3>
            <p class="review-published-meta"></p>
            <p class="review-text"></p>
          </article>
          <details class="review-records">
            <summary>已保存的观察摘要</summary>
            <p class="review-records-status" role="status"></p>
            <ul></ul>
          </details>
        </section>
        <dialog class="chat-sheet" aria-labelledby="chat-sheet-title">
          <header>
            <h2 id="chat-sheet-title"></h2>
            <button
              type="button"
              class="icon-button sheet-close"
              aria-label="关闭面板"
            >
              ×
            </button>
          </header>
          <div class="chat-sheet-body">
            <div class="desktop-permissions">
              <div class="desktop-permission screen-view" hidden>
                <strong>查看屏幕</strong>
                <button type="button" class="secondary screen-view-button">
                  授权查看屏幕
                </button>
                <p class="desktop-permission-status" role="status" hidden></p>
              </div>
              <div class="desktop-permission observation" hidden>
                <strong>自主观察窗口</strong>
                <button
                  type="button"
                  class="secondary"
                  aria-describedby="observation-retention-notice"
                >
                  授权自主观察窗口
                </button>
                <p class="observation-target" hidden></p>
                <p class="desktop-permission-status" role="status" hidden></p>
                <p id="observation-retention-notice" hidden>
                  画面仅交给本次观察的模型服务，服务可能按自身规则保留画面和会话。
                </p>
                <ul class="observation-ineligible" hidden></ul>
              </div>
              <div class="desktop-permission display-observation" hidden>
                <div>
                  <strong>自主观察显示器</strong>
                  <p class="display-grant-count"></p>
                </div>
                <button
                  type="button"
                  class="secondary display-manage"
                  aria-label="管理自主观察显示器"
                >
                  管理 ›
                </button>
              </div>
              <div class="desktop-permission native-control" hidden>
                <strong>控制窗口</strong>
                <button type="button" class="secondary">授权控制窗口</button>
                <p class="desktop-permission-status" role="status" hidden></p>
              </div>
              <div class="desktop-permission browser-control" hidden>
                <strong>访问站点</strong>
                <button type="button" class="secondary browser-control-button">
                  授权访问站点
                </button>
                <p class="desktop-permission-status" role="status" hidden></p>
              </div>
            </div>
            <section class="display-manager" hidden>
              <button type="button" class="quiet display-back">
                ‹ 小窝工具
              </button>
              <p>角色空闲时，可以自己决定是否看一眼获准的屏幕。</p>
              <div class="display-roster"></div>
              <button type="button" class="primary display-add">
                选择角色与显示器
              </button>
            </section>
            <form class="display-picker" hidden>
              <button type="button" class="quiet display-cancel">
                ‹ 自主观察显示器
              </button>
              <label for="display-role">角色</label
              ><select id="display-role" required></select>
              <fieldset class="display-choices">
                <legend>显示器</legend>
                <div></div>
              </fieldset>
              <p class="display-limits"></p>
              <p class="display-replace" hidden>
                确认后将替换这位角色原来的显示器授权。
              </p>
              <div class="sheet-actions">
                <button type="button" class="secondary display-cancel">
                  取消
                </button>
                <button type="submit" class="primary display-confirm">
                  确认授权
                </button>
              </div>
            </form>
            <p class="display-error" role="status" hidden></p>
            <section class="task-picker" hidden>
              <div class="window-task-options" hidden>
                <label class="sr-only" for="window-task-scope">发送方式</label>
                <select id="window-task-scope">
                  <option value="">普通桌边消息</option>
                  <option value="screen" hidden disabled>
                    先靠近再查看窗口
                  </option>
                  <option value="native" hidden disabled>
                    先靠近再操作窗口
                  </option>
                </select>
                <label class="sr-only" for="window-task-role">执行角色</label>
                <select id="window-task-role" hidden></select>
              </div>

              <div class="sheet-actions">
                <button type="button" class="primary use-task">
                  带入输入框
                </button>
              </div>
            </section>
          </div>
        </dialog>
        <dialog
          class="browser-permission-dialog"
          aria-labelledby="browser-permission-title"
        >
          <form class="browser-permission-form">
            <h2 id="browser-permission-title">授权隔离浏览器</h2>
            <label for="browser-role">角色</label>
            <select id="browser-role" required></select>
            <label for="browser-origin">站点来源</label>
            <input
              id="browser-origin"
              type="url"
              maxlength="300"
              autocomplete="off"
              spellcheck="false"
              placeholder="https://example.com"
              required
            />
            <p class="browser-permission-error" role="alert" hidden></p>
            <div class="browser-permission-actions">
              <button type="button" class="secondary browser-permission-cancel">
                取消
              </button>
              <button type="submit" class="primary browser-permission-submit">
                继续
              </button>
            </div>
          </form>
        </dialog>
      </main>
    </template>
  </body>
</html>
