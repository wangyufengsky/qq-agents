<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>纸页小窝</title>
    <link
      rel="preload"
      href="/home-space/paper-nest-hand-v1.530.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/home-preview/style.css" />
    <link rel="stylesheet" href="/board.css" />
    <link rel="stylesheet" href="/home-space/style.css" />
    <link rel="stylesheet" href="/home-space/interiors.css" />
    <link rel="stylesheet" href="/home-space/social.css" />
    <link rel="stylesheet" href="/home-space/letters.css" />
    <script src="/board-ui.js" defer></script>
    <script type="module" src="/home-space/app.mjs"></script>
  </head>
  <body>
    <a class="skip" href="#scene-actions">跳到本页入口</a>
    <header class="masthead">
      <a id="brand-home" class="brand" href="#living"
        ><span class="nest-seal" aria-hidden="true">窝</span
        ><span>纸页小窝</span></a
      >
      <div id="home-tools" hidden>
        <button id="edit-toggle" aria-expanded="false" aria-controls="editor">
          布置
        </button>
        <button id="menu-toggle" aria-label="更多入口">···</button>
      </div>
      <a id="console-return" href="/" aria-label="返回管理台">← 管理台</a>
    </header>
    <main>
      <section id="gate" role="status">
        <p>正在验证管理员登录…</p>
        <a href="/">前往管理台登录</a><button id="retry">重新连接</button
        ><button id="gate-hall">返回走廊</button>
      </section>
      <section id="home-content" hidden>
        <h1 id="title" class="sr-only"></h1>
        <div id="scene-column">
          <div class="book-workspace">
            <nav id="bookmarks" aria-label="小窝书签">
              <button id="bookmark-living">客厅</button>
              <button id="bookmark-hall">走廊</button>
            </nav>
            <section id="stage" aria-label="纸片场景"></section>
          </div>
          <footer class="book-footer">
            <button id="page-back" hidden>← 客厅</button>
            <span id="folio" aria-live="polite"></span>
            <button id="entry-toggle">本页入口</button>
          </footer>
          <div id="pagination"></div>
        </div>
        <aside
          id="editor"
          class="settings"
          aria-labelledby="editor-title"
          hidden
        >
          <header class="editor-heading">
            <div>
              <h2 id="editor-title">布置小窝</h2>
              <p id="selected-object"></p>
            </div>
            <button id="editor-close" aria-label="收起布置面板">收起 ×</button>
          </header>
          <div id="editor-body">
            <p class="toolbox-hint">点选家具，边调边看。</p>
            <div id="object-strip" role="group" aria-label="选择家具"></div>
            <label
              >配色<select id="palette">
                <option value="cream">暖木奶油</option>
                <option value="blue">清晨浅蓝</option>
                <option value="rose">柔和豆沙</option>
              </select></label
            >
            <label class="sr-only"
              >选择纸片<select id="object-select"></select
            ></label>
            <div id="object-editor"></div>
          </div>
          <footer class="settings-footer">
            <p id="layout-status" role="status"></p>
            <div class="editor-actions">
              <button id="save" class="primary">保存布置</button>
              <details id="editor-more">
                <summary>更多操作</summary>
                <div>
                  <button id="undo">撤销最近一次保存</button>
                  <button id="reset">恢复默认草稿</button>
                  <button id="discard">放弃草稿并重读</button>
                </div>
              </details>
            </div>
            <p id="save-status" role="status"></p>
          </footer>
        </aside>
      </section>
    </main>
    <dialog id="entries" class="paper-dialog" aria-labelledby="entries-title">
      <div class="reader-head">
        <h2 id="entries-title">本页入口</h2>
        <button id="close-entries" aria-label="收起本页入口">×</button>
      </div>
      <p id="subtitle"></p>
      <nav id="scene-actions" aria-label="场景文字入口"></nav>
    </dialog>
    <dialog id="menu" class="paper-dialog" aria-labelledby="menu-title">
      <div class="reader-head">
        <h2 id="menu-title">小窝目录</h2>
        <button id="close-menu" aria-label="收起小窝目录">×</button>
      </div>
      <nav class="paper-links" aria-label="小窝操作">
        <button id="social-open">往来管理</button>
        <button id="refresh">刷新当前页面</button>
      </nav>
    </dialog>
    <dialog id="reader" class="paper-dialog" aria-labelledby="reader-title">
      <div class="reader-head">
        <h2 id="reader-title"></h2>
        <button id="close-reader" aria-label="关闭面板">×</button>
      </div>
      <div id="reader-content"></div>
      <button id="reader-back">返回当前场景</button>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
